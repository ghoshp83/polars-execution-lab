name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  python:
    name: python (ruff + pytest + cross-language equivalence)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Create venv and install
        run: |
          uv venv
          # Polars 2.x is built from the 0.55 crate line the Rust half pins,
          # so the equivalence tests compare one engine generation with itself.
          uv pip install "polars>=2,<3" websockets pyarrow pytest pytest-cov ruff
      - name: Lint
        run: |
          uv run ruff check python
          uv run ruff format --check python
      - name: Build Rust binary (for the equivalence test)
        run: cargo build --release
      - name: Test
        run: XEXEC_BIN=target/release/xexec uv run pytest --cov=xexeclab
