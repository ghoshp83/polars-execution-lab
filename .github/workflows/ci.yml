name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  python:
    name: python (ruff + pytest + cross-language equivalence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Create venv and install
        run: |
          uv venv
          uv pip install polars websockets pyarrow pytest pytest-cov ruff
      - name: Lint
        run: |
          uv run ruff check python
          uv run ruff format --check python
      - name: Build Rust binary (for the equivalence test)
        run: cargo build --release
      - name: Test
        run: XEXEC_BIN=target/release/xexec uv run pytest --cov=xexeclab

  polars2:
    name: python (Polars 2.0 forward-compatibility, advisory)
    runs-on: ubuntu-latest
    # Advisory only. The project pins `polars>=1.0` and the Rust half is on the
    # 0.x crate line, so the Python engine must not be pinned to a 2.0 release
    # candidate -- the two halves would then be different engine generations and
    # the equivalence tests would be comparing across a version boundary. This
    # job exists to find out *early* when a 2.0 change would break us, not to
    # gate the build on a pre-release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install the Polars 2.0 release candidate
        run: |
          uv venv
          uv pip install --prerelease=allow "polars>=2.0rc1" websockets pyarrow pytest
          uv run python -c "import polars; print('polars', polars.__version__)"
      - name: Test the Python engine against Polars 2.0
        # The equivalence tests are excluded on purpose: they compare against a
        # Rust binary built on the 0.x crate line, so a failure there would say
        # something about the version gap rather than about our code.
        run: uv run pytest python/tests -q -m "not equivalence"
      - name: Fingerprint a 400k-tick capture under Polars 2.0
        # The fixtures above are too small for the streaming engine to partition,
        # so they cannot see a change in how a column is summed. This can.
        run: PYTHONPATH=python uv run python -m xexeclab.compat dump v2.json
      - name: Fingerprint the same capture under Polars 1.x
        run: |
          uv venv .venv1
          VIRTUAL_ENV=.venv1 uv pip install "polars>=1.0,<2"
          PYTHONPATH=python .venv1/bin/python -m xexeclab.compat dump v1.json
      - name: Compare bit for bit against the recorded baseline
        # Passes while the versions differ exactly as recorded in the baseline;
        # fails on any new, changed, or vanished difference.
        run: PYTHONPATH=python uv run python -m xexeclab.compat compare v1.json v2.json python/tests/polars2_baseline.json
