[project]
name = "polars-execution-lab"
version = "0.13.0"
description = "Execution-analytics engine over crypto tick data: the same Polars engine in Rust and Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pralay Ghosh" }]
keywords = [
    "polars",
    "crypto",
    "market-data",
    "execution-algorithms",
    "vwap",
    "twap",
    "tick-data",
    "trading",
    "rust",
    "market-microstructure",
    "order-book",
    "level2",
    "market-impact",
    "almgren-chriss",
    "transaction-cost-analysis",
    "robust-regression",
]
dependencies = [
    "polars>=1.0",
    "websockets>=12",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
xexeclab = "xexeclab.cli:main"

[project.urls]
Homepage = "https://github.com/ghoshp83/polars-execution-lab"
Repository = "https://github.com/ghoshp83/polars-execution-lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/xexeclab"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]
addopts = "-q"
markers = [
    "equivalence: cross-language Rust/Python equivalence (needs the built xexec binary)",
]

[tool.coverage.run]
branch = true
source = ["python/xexeclab"]
